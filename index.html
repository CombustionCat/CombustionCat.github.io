<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Research Forest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#030310;
  --panel:#08081e;
  --panel2:rgba(8,8,30,0.92);
  --border:rgba(80,120,255,0.18);
  --accent:#4a90ff;
  --accent2:#7ab8ff;
  --glow:rgba(74,144,255,0.25);
  --text:#c8d8ff;
  --dim:rgba(200,216,255,0.45);
  --green:#44ff88;
  --amber:#ffaa44;
  --red:#ff4455;
  --purple:#aa88ff;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;}

/* ── STARFIELD CANVAS ── */
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ── LOGIN ── */
#login{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.lbox{background:var(--panel2);border:1px solid var(--border);border-radius:18px;padding:44px 40px;width:360px;text-align:center;box-shadow:0 0 60px var(--glow),0 0 120px rgba(74,144,255,0.08);}
.lbox h1{font-size:20px;letter-spacing:3px;color:var(--accent2);margin-bottom:6px;}
.lbox p{color:var(--dim);font-size:12px;margin-bottom:28px;line-height:1.6;}
.lbox input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-size:14px;outline:none;margin-bottom:14px;transition:border .2s;}
.lbox input:focus{border-color:var(--accent);}
#login-msg{min-height:18px;font-size:12px;color:var(--red);margin-top:10px;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#1a55cc,var(--accent));border:none;border-radius:8px;padding:10px 20px;color:#fff;font-size:13px;cursor:pointer;transition:all .18s;letter-spacing:.3px;white-space:nowrap;}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 18px var(--glow);}
.btn-ghost{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{background:rgba(255,255,255,0.09);box-shadow:none;}
.btn-red{background:linear-gradient(135deg,#991122,var(--red));}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:6px;}
.icon-btn{background:none;border:none;color:var(--dim);cursor:pointer;padding:3px 5px;border-radius:4px;font-size:13px;transition:color .15s;line-height:1;}
.icon-btn:hover{color:var(--text);}

/* ── APP SHELL ── */
#app{display:none;height:100vh;flex-direction:column;position:relative;z-index:1;}
#app.on{display:flex;}

/* ── TOPBAR ── */
#topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel2);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);z-index:50;flex-shrink:0;}
#topbar .logo{font-size:13px;letter-spacing:2.5px;color:var(--accent2);font-weight:600;margin-right:4px;white-space:nowrap;}
.vtabs{display:flex;gap:3px;background:rgba(0,0,0,0.35);border-radius:8px;padding:3px;}
.vtab{padding:5px 13px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--dim);transition:all .18s;border:none;background:none;}
.vtab.on{background:var(--accent);color:#fff;}
.spacer{flex:1;}
#topbar .right{display:flex;align-items:center;gap:6px;}

/* ── BODY ── */
#body{display:flex;flex:1;overflow:hidden;}

/* ── SIDEBAR ── */
#sidebar{width:210px;background:var(--panel2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;backdrop-filter:blur(16px);}
.sb-head{padding:11px 12px 9px;font-size:10px;letter-spacing:1.2px;color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
#node-list{flex:1;overflow-y:auto;padding:6px 0;}
.n-item{display:flex;align-items:center;gap:7px;padding:7px 11px;cursor:pointer;transition:background .13s;font-size:13px;}
.n-item:hover,.n-item.sel{background:rgba(74,144,255,0.1);}
.ndot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.nname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nbadge{font-size:9px;padding:2px 5px;border-radius:3px;flex-shrink:0;letter-spacing:.3px;}
.sb-footer{padding:9px 11px;border-top:1px solid var(--border);}
/* Status colours */
.s-active .ndot,.dot-active{background:#4a90ff;box-shadow:0 0 5px #4a90ff;}
.s-exploring .ndot,.dot-exploring{background:#ffaa44;box-shadow:0 0 5px #ffaa44;}
.s-completed .ndot,.dot-completed{background:#44ff88;box-shadow:0 0 5px #44ff88;}
.s-abandoned .ndot,.dot-abandoned{background:#ff4455;box-shadow:0 0 5px #ff4455;}
.s-paused .ndot,.dot-paused{background:#9999cc;box-shadow:0 0 5px #9999cc;}
.bg-active{background:rgba(74,144,255,0.15);color:#88bbff;}
.bg-exploring{background:rgba(255,170,68,0.15);color:#ffcc88;}
.bg-completed{background:rgba(68,255,136,0.15);color:#88ffaa;}
.bg-abandoned{background:rgba(255,68,85,0.15);color:#ff9988;}
.bg-paused{background:rgba(153,153,204,0.15);color:#bbbbdd;}

/* ── MAIN VIEW ── */
#main{flex:1;position:relative;overflow:hidden;}
.view{position:absolute;inset:0;display:none;}
.view.on{display:block;}
#top-view svg{width:100%;height:100%;}

/* ── DETAIL PANEL ── */
#panel{width:320px;flex-shrink:0;background:var(--panel2);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(320px);transition:transform .28s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(16px);}
#panel.on{transform:translateX(0);}
.ph{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;}
.ph h3{flex:1;font-size:13px;color:var(--accent2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ptabs{display:flex;border-bottom:1px solid var(--border);}
.ptab{flex:1;padding:8px;text-align:center;font-size:11px;cursor:pointer;color:var(--dim);border:none;background:none;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.3px;}
.ptab.on{color:var(--accent);border-bottom-color:var(--accent);}
#pcontent{flex:1;overflow-y:auto;padding:14px;}
#pcontent::-webkit-scrollbar{width:3px;}
#pcontent::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ── FORM ── */
.fg{margin-bottom:13px;}
.fg label{display:block;font-size:10px;letter-spacing:.8px;color:var(--dim);margin-bottom:5px;text-transform:uppercase;}
.fg input,.fg select,.fg textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-size:13px;outline:none;transition:border .18s;font-family:inherit;}
.fg textarea{min-height:76px;resize:vertical;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);}
.fg select option{background:#08081e;}

/* ── TASKS ── */
.task{display:flex;align-items:flex-start;gap:7px;padding:8px 9px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;}
.task input[type=checkbox]{margin-top:2px;flex-shrink:0;accent-color:var(--accent);width:13px;height:13px;}
.tbadge{font-size:9px;padding:2px 5px;border-radius:3px;flex-shrink:0;margin-top:1px;letter-spacing:.3px;}
.t-theory{background:rgba(150,100,255,0.18);color:#bb99ff;}
.t-literature{background:rgba(68,200,255,0.18);color:#88ddff;}
.t-cfd{background:rgba(255,150,68,0.18);color:#ffcc99;}
.t-coding{background:rgba(68,255,150,0.18);color:#99ffcc;}
.t-analysis{background:rgba(255,200,68,0.18);color:#ffdd99;}
.t-writing{background:rgba(255,100,150,0.18);color:#ffaabb;}
.t-other{background:rgba(150,150,150,0.18);color:#aaaaaa;}
.task-body{flex:1;min-width:0;}
.task-name{font-size:13px;line-height:1.4;}
.task-desc{font-size:11px;color:var(--dim);margin-top:2px;}
.task.done .task-name{text-decoration:line-through;opacity:.45;}
.tadd{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;padding:11px;margin-top:4px;}
.tadd-title{font-size:10px;letter-spacing:.8px;color:var(--dim);text-transform:uppercase;margin-bottom:9px;}

/* ── PARAGRAPHS ── */
.para{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;}
.para-meta{font-size:10px;color:var(--dim);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;}
.para-text{font-size:13px;line-height:1.7;white-space:pre-wrap;}
.para-refs{font-size:11px;color:var(--dim);margin-top:5px;font-style:italic;}

/* ── CONNECT MODE BANNER ── */
#connect-banner{position:fixed;top:54px;left:50%;transform:translateX(-50%);background:rgba(255,170,68,0.12);border:1px solid rgba(255,170,68,0.35);border-radius:8px;padding:7px 18px;font-size:12px;color:#ffcc88;z-index:200;display:none;pointer-events:none;}

/* ── MODAL ── */
#modal-wrap{position:fixed;inset:0;background:rgba(0,0,10,0.72);display:none;align-items:center;justify-content:center;z-index:600;backdrop-filter:blur(4px);}
#modal-wrap.on{display:flex;}
.modal{background:var(--panel2);border:1px solid var(--border);border-radius:13px;padding:26px;width:420px;max-width:95vw;box-shadow:0 0 50px rgba(0,0,0,.6);}
.modal h3{font-size:15px;margin-bottom:18px;color:var(--accent2);}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

/* ── THESIS ── */
#thesis-view{overflow-y:auto;padding:36px 20px;}
.tdoc{max-width:740px;margin:0 auto;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:12px;padding:44px 48px;}
.tdoc h1{font-size:21px;color:var(--accent2);margin-bottom:4px;}
.tdoc-meta{color:var(--dim);font-size:12px;margin-bottom:32px;}
.tsec{margin-bottom:30px;}
.tsec h2{font-size:15px;color:var(--accent2);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.tsec p{font-size:13px;line-height:1.85;margin-bottom:14px;color:var(--text);}
.tsec .tref{font-size:11px;color:var(--dim);font-style:italic;margin-top:-10px;margin-bottom:14px;}

/* ── EMPTY STATE ── */
.empty{text-align:center;color:var(--dim);padding:28px 16px;font-size:13px;line-height:1.7;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* ── TOOLTIP ── */
#tip{position:fixed;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:11px;pointer-events:none;z-index:300;display:none;max-width:200px;}

/* ── FRONT VIEW ── */
#front-view{background:#020210;}
#fcanvas{width:100%;height:100%;}
#front-hud{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;}
#fnode-name{font-size:17px;color:var(--accent2);text-shadow:0 0 20px var(--accent);}
#fnode-status{font-size:11px;color:var(--dim);letter-spacing:1.5px;margin-top:3px;}
#front-hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);pointer-events:none;}

/* ── ZOTERO AUTOCOMPLETE ── */
.zot-wrap{position:relative;}
.zot-dd{display:none;position:absolute;top:calc(100% + 2px);left:0;right:0;z-index:400;background:#0a0a22;border:1px solid var(--border);border-radius:6px;max-height:210px;overflow-y:auto;box-shadow:0 8px 28px rgba(0,0,0,.6);}
.zot-item{padding:9px 11px;font-size:12px;cursor:pointer;border-bottom:1px solid rgba(80,120,255,0.08);line-height:1.4;color:var(--text);}
.zot-item:hover{background:rgba(74,144,255,0.1);}
.zot-item:last-child{border-bottom:none;}
.zot-title{font-weight:500;}
.zot-meta{font-size:10px;color:var(--dim);margin-top:2px;}
.zot-badge{font-size:9px;background:rgba(68,200,255,0.15);color:#88ddff;border-radius:3px;padding:1px 5px;margin-left:4px;vertical-align:middle;letter-spacing:.3px;}

/* ── REFERENCE PICKER ── */
.ref-picker{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:7px;}
.ref-chip{display:inline-block;background:rgba(74,144,255,0.1);border:1px solid rgba(74,144,255,0.22);border-radius:5px;padding:4px 9px;font-size:11px;cursor:pointer;margin:2px 3px;transition:background .15s;color:var(--accent2);}
.ref-chip:hover{background:rgba(74,144,255,0.22);}
</style>
</head>
<body>

<!-- BACKGROUND STARFIELD -->
<canvas id="starfield"></canvas>

<!-- ════════ LOGIN ════════ -->
<div id="login">
  <div class="lbox">
    <h1>✦ RESEARCH FOREST ✦</h1>
    <p>Your private PhD research navigator.<br>Set a passphrase on first visit.</p>
    <input id="pw" type="password" placeholder="Passphrase..." autocomplete="current-password" />
    <button class="btn" style="width:100%;" onclick="doLogin()">Enter the Forest</button>
    <div id="login-msg"></div>
  </div>
</div>

<!-- ════════ APP ════════ -->
<div id="app">

  <!-- TOPBAR -->
  <div id="topbar">
    <div class="logo">✦ RESEARCH FOREST</div>
    <div class="vtabs">
      <button class="vtab on" id="vtab-top" onclick="switchView('top')">☆ Constellation</button>
      <button class="vtab" id="vtab-front" onclick="switchView('front')">◈ First-Person</button>
      <button class="vtab" id="vtab-thesis" onclick="switchView('thesis')">✦ Thesis</button>
    </div>
    <div class="spacer"></div>
    <div class="right">
      <button class="btn btn-ghost btn-sm" onclick="showSettings()">⚙ Zotero</button>
      <button class="btn btn-ghost btn-sm" onclick="doExport()">Export</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('imp').click()">Import</button>
      <input id="imp" type="file" accept=".json" style="display:none" onchange="doImport(event)">
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <!-- BODY -->
  <div id="body">

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sb-head">
        Nodes
        <button class="btn btn-sm" style="padding:3px 8px;font-size:10px;" onclick="showAddNodeModal()">+ Add</button>
      </div>
      <div id="node-list"></div>
      <div class="sb-footer">
        <div class="sb-head" style="padding:0 0 8px;border:none;font-size:10px;">Paths</div>
        <button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;" onclick="startConnect()">⟷ Connect Nodes</button>
      </div>
    </div>

    <!-- MAIN -->
    <div id="main">

      <!-- TOP / CONSTELLATION VIEW -->
      <div id="top-view" class="view on">
        <svg id="tsvg"></svg>
      </div>

      <!-- FRONT / FIRST-PERSON VIEW -->
      <div id="front-view" class="view">
        <canvas id="fcanvas"></canvas>
        <div id="front-hud">
          <div id="fnode-name"></div>
          <div id="fnode-status"></div>
        </div>
        <div id="front-hint">Click a star to travel to that node · Click node in sidebar to change position</div>
      </div>

      <!-- THESIS VIEW -->
      <div id="thesis-view" class="view">
        <div class="tdoc" id="tdoc"></div>
      </div>

    </div><!-- /#main -->

    <!-- DETAIL PANEL -->
    <div id="panel">
      <div class="ph">
        <div class="ndot" id="p-dot"></div>
        <h3 id="p-title">—</h3>
        <button class="icon-btn" onclick="closePanel()">✕</button>
      </div>
      <div class="ptabs">
        <button class="ptab on" id="pt-info" onclick="switchTab('info')">Info</button>
        <button class="ptab" id="pt-tasks" onclick="switchTab('tasks')">Tasks</button>
        <button class="ptab" id="pt-notes" onclick="switchTab('notes')">Notes</button>
        <button class="ptab" id="pt-paths" onclick="switchTab('paths')">Paths</button>
      </div>
      <div id="pcontent"></div>
    </div>

  </div><!-- /#body -->
</div><!-- /#app -->

<!-- CONNECT MODE BANNER -->
<div id="connect-banner">Click the SOURCE node, then the TARGET node — ESC to cancel</div>

<!-- TOOLTIP -->
<div id="tip"></div>

<!-- MODAL -->
<div id="modal-wrap" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body"></div>
</div>

<!-- D3 -->
<script src="https://d3js.org/d3.v7.min.js"></script>

<script>
'use strict';
// ═══════════════════════════════════════════════
//  RESEARCH FOREST  —  PhD Research Navigator
// ═══════════════════════════════════════════════

// ── STATE ──────────────────────────────────────
let DB = { nodes:{}, paths:{}, tasks:{} };
let selNode = null;   // selected node id
let frontNode = null; // node id shown in front view
let curView = 'top';
let curTab = 'info';
let connectMode = false;
let connectSrc = null;

// ── AUTH ───────────────────────────────────────
async function sha256(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function doLogin(){
  const pw = document.getElementById('pw').value.trim();
  const msg = document.getElementById('login-msg');
  if(!pw){msg.textContent='Enter a passphrase.';return;}
  const h = await sha256(pw);
  const stored = localStorage.getItem('rf_auth');
  if(!stored){
    if(pw.length<4){msg.textContent='At least 4 characters please.';return;}
    localStorage.setItem('rf_auth',h);
    bootApp();
  } else if(stored===h){
    bootApp();
  } else {
    msg.textContent='Wrong passphrase.';
    document.getElementById('pw').value='';
  }
}

function doLogout(){
  selNode=null;frontNode=null;
  document.getElementById('app').classList.remove('on');
  document.getElementById('login').style.display='flex';
  document.getElementById('pw').value='';
  cancelConnect();
}

document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// ── STORAGE ────────────────────────────────────
function load(){
  try{const s=localStorage.getItem('rf_data');if(s)DB=JSON.parse(s);}catch(e){}
  DB.nodes=DB.nodes||{};DB.paths=DB.paths||{};DB.tasks=DB.tasks||{};
}
function save(){localStorage.setItem('rf_data',JSON.stringify(DB));}

function doExport(){
  const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(b),download:`research-forest-${today()}.json`});
  a.click();
}
function doImport(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{DB=JSON.parse(e.target.result);save();render();}catch{alert('Invalid JSON');}};
  r.readAsText(f);ev.target.value='';
}
function today(){return new Date().toISOString().slice(0,10);}

// ── BOOT ───────────────────────────────────────
function bootApp(){
  load();
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  initStarfield();
  initTopView();
  render();
}

function render(){
  renderSidebar();
  if(curView==='top') renderTopView();
  if(curView==='front') renderFrontView();
  if(curView==='thesis') renderThesisView();
  if(selNode) renderPanel();
}

// ── VIEWS ──────────────────────────────────────
function switchView(v){
  curView=v;
  ['top','front','thesis'].forEach(x=>{
    document.getElementById(x+'-view').classList.toggle('on',x===v);
    document.getElementById('vtab-'+x).classList.toggle('on',x===v);
  });
  if(v==='top') renderTopView();
  if(v==='front') renderFrontView();
  if(v==='thesis') renderThesisView();
}

// ── UTILS ──────────────────────────────────────
let _uid=0;
function uid(){return Date.now().toString(36)+(++_uid).toString(36)+Math.random().toString(36).slice(2,5);}

function esc(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function statusColor(s){
  return{active:'#4a90ff',exploring:'#ffaa44',completed:'#44ff88',abandoned:'#ff4455',paused:'#9999cc'}[s]||'#888';
}
function pathColor(s){
  return{open:'rgba(100,160,255,0.5)',active:'rgba(68,255,136,0.6)',abandoned:'rgba(255,68,85,0.3)',completed:'rgba(68,255,200,0.55)'}[s]||'rgba(100,160,255,0.4)';
}

// ── NODES ──────────────────────────────────────
function addNode(name,status,desc){
  const id=uid();
  const svgEl=document.getElementById('tsvg');
  const W=svgEl.clientWidth||800, H=svgEl.clientHeight||600;
  DB.nodes[id]={id,name,status:status||'exploring',description:desc||'',
    x:W/2+(Math.random()-.5)*220, y:H/2+(Math.random()-.5)*220,
    paragraphs:[], taskIds:[]};
  save();render();return id;
}
function updateNode(id,patch){if(DB.nodes[id])Object.assign(DB.nodes[id],patch);save();render();}
function deleteNode(id){
  Object.keys(DB.paths).forEach(pid=>{const p=DB.paths[pid];if(p.source===id||p.target===id)delete DB.paths[pid];});
  Object.keys(DB.tasks).forEach(tid=>{DB.tasks[tid].nodeIds=(DB.tasks[tid].nodeIds||[]).filter(n=>n!==id);});
  if(DB.nodes[id]?.taskIds){DB.nodes[id].taskIds.forEach(tid=>delete DB.tasks[tid]);}
  delete DB.nodes[id];
  if(selNode===id){selNode=null;closePanel();}
  if(frontNode===id)frontNode=Object.keys(DB.nodes)[0]||null;
  save();render();
}

// ── PATHS ──────────────────────────────────────
function addPath(src,tgt,name,status){
  const dup=Object.values(DB.paths).some(p=>(p.source===src&&p.target===tgt)||(p.source===tgt&&p.target===src));
  if(dup){alert('A path between these nodes already exists.');return null;}
  const id=uid();
  DB.paths[id]={id,source:src,target:tgt,name:name||'',status:status||'open'};
  save();render();return id;
}
function deletePath(id){delete DB.paths[id];save();render();}
function updatePath(id,patch){if(DB.paths[id])Object.assign(DB.paths[id],patch);save();render();}

// ── TASKS ──────────────────────────────────────
function addTask(name,type,nodeIds,desc){
  const id=uid();
  DB.tasks[id]={id,name,type:type||'other',status:'todo',description:desc||'',nodeIds:nodeIds||[]};
  (nodeIds||[]).forEach(nid=>{
    if(DB.nodes[nid]){DB.nodes[nid].taskIds=DB.nodes[nid].taskIds||[];
      if(!DB.nodes[nid].taskIds.includes(id))DB.nodes[nid].taskIds.push(id);}
  });
  save();renderPanel();return id;
}
function toggleTask(id){
  const t=DB.tasks[id];if(!t)return;
  t.status=t.status==='done'?'todo':'done';save();renderPanel();
}
function deleteTask(id){
  (DB.tasks[id]?.nodeIds||[]).forEach(nid=>{
    if(DB.nodes[nid])DB.nodes[nid].taskIds=(DB.nodes[nid].taskIds||[]).filter(t=>t!==id);
  });
  delete DB.tasks[id];save();renderPanel();
}

// ── PARAGRAPHS ─────────────────────────────────
function addPara(nodeId,content,refs){
  const n=DB.nodes[nodeId];if(!n)return;
  n.paragraphs=n.paragraphs||[];
  n.paragraphs.push({id:uid(),content,refs:refs||'',at:new Date().toISOString()});
  save();renderPanel();
}
function deletePara(nodeId,paraId){
  const n=DB.nodes[nodeId];if(!n)return;
  n.paragraphs=(n.paragraphs||[]).filter(p=>p.id!==paraId);save();renderPanel();
}
function updatePara(nodeId,paraId,content,refs){
  const n=DB.nodes[nodeId];if(!n)return;
  const p=n.paragraphs?.find(p=>p.id===paraId);if(p){p.content=content;p.refs=refs;}
  save();renderPanel();
}

// ── STARFIELD (background) ─────────────────────
function initStarfield(){
  const cv=document.getElementById('starfield');
  const cx=cv.getContext('2d');
  let stars=[];
  const resize=()=>{
    cv.width=innerWidth;cv.height=innerHeight;
    stars=Array.from({length:180},()=>({
      x:Math.random()*cv.width, y:Math.random()*cv.height,
      r:Math.random()*1.3+0.2, a:Math.random()*.6+.2,
      da:(Math.random()*.008+.003)*(Math.random()>.5?1:-1)
    }));
  };
  const draw=()=>{
    cx.clearRect(0,0,cv.width,cv.height);
    stars.forEach(s=>{
      s.a+=s.da;if(s.a>0.85||s.a<0.1)s.da*=-1;
      cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);
      cx.fillStyle=`rgba(190,210,255,${s.a})`;cx.fill();
    });
    requestAnimationFrame(draw);
  };
  resize();draw();
  window.addEventListener('resize',resize);
}

// ── TOP VIEW (D3 Constellation) ─────────────────
let tSvg, tG, linkRefs={};

function initTopView(){
  tSvg=d3.select('#tsvg');
  tSvg.selectAll('*').remove();

  // SVG defs — glow filters
  const defs=tSvg.append('defs');
  ['active','exploring','completed','abandoned','paused','connect'].forEach(s=>{
    const f=defs.append('filter').attr('id','gf-'+s).attr('x','-80%').attr('y','-80%').attr('width','260%').attr('height','260%');
    f.append('feGaussianBlur').attr('stdDeviation','4').attr('result','blur');
    const m=f.append('feMerge');m.append('feMergeNode').attr('in','blur');m.append('feMergeNode').attr('in','SourceGraphic');
  });

  // Zoom
  const zoom=d3.zoom().scaleExtent([0.15,4]).on('zoom',e=>tG?.attr('transform',e.transform));
  tSvg.call(zoom);

  // Dismiss click
  tSvg.on('click',()=>{if(!connectMode){selNode=null;renderSidebar();closePanel();}});

  tG=tSvg.append('g');
  renderTopView();
}

function renderTopView(){
  if(!tG)return;
  tG.selectAll('*').remove();
  linkRefs={};

  const nodes=Object.values(DB.nodes);
  const paths=Object.values(DB.paths);

  // ── LINKS layer
  const lLayer=tG.append('g');
  paths.forEach(p=>{
    const s=DB.nodes[p.source], t=DB.nodes[p.target];
    if(!s||!t)return;
    const col=pathColor(p.status);
    const abandoned=p.status==='abandoned';

    const glow=lLayer.append('line')
      .attrs({x1:s.x,y1:s.y,x2:t.x,y2:t.y,stroke:col,'stroke-width':10,opacity:.13});
    const line=lLayer.append('line')
      .attrs({x1:s.x,y1:s.y,x2:t.x,y2:t.y,stroke:col,'stroke-width':1.5,opacity:abandoned?.4:.85})
      .style('stroke-dasharray',abandoned?'6,6':'none');

    if(p.name){
      lLayer.append('text')
        .attrs({x:(s.x+t.x)/2,y:(s.y+t.y)/2-7,'text-anchor':'middle',fill:'rgba(180,200,255,0.4)','font-size':'9.5px'})
        .text(p.name.length>20?p.name.slice(0,18)+'…':p.name);
    }
    linkRefs[p.id]={glow,line,p};
  });

  // ── NODES layer
  const nLayer=tG.append('g');
  nodes.forEach(n=>{
    const col=statusColor(n.status);
    const isSel=n.id===selNode;
    const isSrc=connectSrc===n.id;
    const tasks=(n.taskIds||[]).map(tid=>DB.tasks[tid]).filter(Boolean);
    const done=tasks.filter(t=>t.status==='done').length;

    const g=nLayer.append('g')
      .attr('transform',`translate(${n.x},${n.y})`)
      .attr('cursor','pointer')
      .attr('class','ngrp')
      .on('click',function(e){e.stopPropagation();connectMode?handleConnectClick(n.id):selectNode(n.id);})
      .on('mouseenter',function(e){showTip(e,n.name+(tasks.length?`\n${done}/${tasks.length} tasks`:''));})
      .on('mouseleave',()=>hideTip());

    // Outer glow ring
    g.append('circle')
      .attrs({r:isSel?26:isSrc?24:18,fill:'none',stroke:isSrc?'#ffaa44':col,'stroke-width':isSel||isSrc?2:1,opacity:.3})
      .style('filter',`url(#gf-${n.status})`);

    // Star shape
    g.append('path').attr('d',starPath(0,0,isSel?11:7,isSel?4.5:3,4))
      .attr('fill',col).style('filter',`url(#gf-${n.status})`);

    // Core dot
    g.append('circle').attrs({r:isSel?4:2.5,fill:'white'});

    // Task progress
    if(tasks.length){
      g.append('text').attrs({y:22,'text-anchor':'middle',fill:'rgba(190,210,255,0.55)','font-size':'9px'})
        .text(`${done}/${tasks.length}`);
    }

    // Name label
    const short=n.name.length>18?n.name.slice(0,16)+'…':n.name;
    g.append('text').attrs({y:tasks.length?33:22,'text-anchor':'middle',fill:isSel?'#fff':'rgba(200,218,255,0.88)','font-size':isSel?'11.5px':'10.5px','font-weight':isSel?'600':'normal'})
      .text(short);

    // Drag
    g.call(d3.drag()
      .on('start',function(e){e.sourceEvent.stopPropagation();})
      .on('drag',function(e,_d){
        n.x=e.x;n.y=e.y;
        d3.select(this).attr('transform',`translate(${e.x},${e.y})`);
        // Update links live
        Object.values(linkRefs).forEach(({glow,line,p})=>{
          if(p.source===n.id||p.target===n.id){
            const s=DB.nodes[p.source],t=DB.nodes[p.target];
            if(s&&t){
              glow.attrs({x1:s.x,y1:s.y,x2:t.x,y2:t.y});
              line.attrs({x1:s.x,y1:s.y,x2:t.x,y2:t.y});
            }
          }
        });
      })
      .on('end',()=>save())
    );
  });
}

function starPath(cx,cy,ro,ri,pts){
  const step=Math.PI/pts;let d='';
  for(let i=0;i<pts*2;i++){
    const r=i%2===0?ro:ri, a=i*step-Math.PI/2;
    d+=(i===0?'M':'L')+(cx+r*Math.cos(a))+','+(cy+r*Math.sin(a));
  }
  return d+'Z';
}

// Extend d3 selection with attrs helper
d3.selection.prototype.attrs=function(obj){
  Object.entries(obj).forEach(([k,v])=>this.attr(k,v));return this;
};

// ── FRONT VIEW (First-Person) ──────────────────
let fCtx, fFrame, fHitAreas=[];

function renderFrontView(){
  cancelAnimationFrame(fFrame);
  const cv=document.getElementById('fcanvas');
  const wrap=document.getElementById('front-view');
  cv.width=wrap.clientWidth;cv.height=wrap.clientHeight;
  fCtx=cv.getContext('2d');

  const nid=frontNode||Object.keys(DB.nodes)[0]||null;
  if(!nid||!DB.nodes[nid]){
    // Empty state
    fCtx.fillStyle='#020210';fCtx.fillRect(0,0,cv.width,cv.height);
    fCtx.fillStyle='rgba(180,200,255,0.3)';fCtx.font='14px Segoe UI, sans-serif';fCtx.textAlign='center';
    fCtx.fillText('Add nodes and select one to explore the First-Person view',cv.width/2,cv.height/2);
    document.getElementById('fnode-name').textContent='';
    document.getElementById('fnode-status').textContent='';
    return;
  }

  const node=DB.nodes[nid];
  const connPaths=Object.values(DB.paths).filter(p=>p.source===nid||p.target===nid);

  // Background stars
  const bgStars=Array.from({length:320},()=>({
    x:Math.random()*cv.width, y:Math.random()*cv.height,
    r:Math.random()*1.2+.2, a:Math.random()*.7+.2,
    da:(Math.random()*.015+.005)*(Math.random()>.5?1:-1)
  }));

  // HUD
  document.getElementById('fnode-name').textContent=node.name;
  document.getElementById('fnode-status').textContent=node.status.toUpperCase();

  // Pre-compute destination positions (fan across upper area)
  const W=cv.width, H=cv.height;
  const spread=Math.min(Math.PI*1.1, connPaths.length>1?Math.PI*1.4:0);
  const destPositions=connPaths.map((p,i)=>{
    const n2=connPaths.length;
    const angleOffset=n2===1?0:(i/(n2-1)-.5)*spread;
    const baseAngle=-Math.PI/2+angleOffset;
    const dist=H*0.42+Math.random()*H*.05;
    const targX=W/2+Math.sin(baseAngle)*W*.32;
    const targY=H*.18+Math.abs(Math.cos(baseAngle*.8))*H*.1;
    const othId=p.source===nid?p.target:p.source;
    return{p,othId,targX,targY};
  });

  fHitAreas=[];

  function frame(){
    fCtx.clearRect(0,0,W,H);

    // BG gradient
    const g=fCtx.createRadialGradient(W/2,H*.6,0,W/2,H*.3,Math.max(W,H)*.9);
    g.addColorStop(0,'#0c0825');g.addColorStop(1,'#020210');
    fCtx.fillStyle=g;fCtx.fillRect(0,0,W,H);

    // BG stars
    bgStars.forEach(s=>{
      s.a+=s.da;if(s.a>.9||s.a<.1)s.da*=-1;
      fCtx.beginPath();fCtx.arc(s.x,s.y,s.r,0,Math.PI*2);
      fCtx.fillStyle=`rgba(200,218,255,${s.a})`;fCtx.fill();
    });

    fHitAreas=[];

    // Draw paths + destination nodes
    const sx=W/2, sy=H-70;
    destPositions.forEach(({p,othId,targX,targY})=>{
      const other=DB.nodes[othId];if(!other)return;
      const col=statusColor(other.status);
      const aban=p.status==='abandoned';

      // Beam (translucent trapezoid)
      const beamGrad=fCtx.createLinearGradient(sx,sy,targX,targY);
      beamGrad.addColorStop(0,aban?'rgba(255,68,85,0.35)':col.replace('#','rgba(').replace(/(.{2})(.{2})(.{2})/,(_,r,g,b)=>`${parseInt(r,16)},${parseInt(g,16)},${parseInt(b,16)},0.3)`)||'rgba(74,144,255,0.3)');
      beamGrad.addColorStop(1,'rgba(0,0,0,0)');
      fCtx.beginPath();
      fCtx.moveTo(sx-12,sy);fCtx.lineTo(targX-1.5,targY);
      fCtx.lineTo(targX+1.5,targY);fCtx.lineTo(sx+12,sy);
      fCtx.closePath();fCtx.fillStyle=beamGrad;fCtx.fill();

      // Beam centre line
      fCtx.beginPath();fCtx.moveTo(sx,sy);fCtx.lineTo(targX,targY);
      fCtx.strokeStyle=aban?'rgba(255,68,85,0.4)':hexAlpha(col,0.5);
      fCtx.lineWidth=1;
      if(aban)fCtx.setLineDash([8,8]);
      fCtx.stroke();fCtx.setLineDash([]);

      // Destination glow ring
      fCtx.beginPath();fCtx.arc(targX,targY,22,0,Math.PI*2);
      fCtx.fillStyle=hexAlpha(col,0.12);fCtx.fill();

      // Destination star
      fCtx.beginPath();fCtx.arc(targX,targY,10,0,Math.PI*2);
      fCtx.fillStyle=hexAlpha(col,0.75);fCtx.fill();
      fCtx.beginPath();fCtx.arc(targX,targY,4,0,Math.PI*2);
      fCtx.fillStyle='#fff';fCtx.fill();

      // Node name
      fCtx.font='bold 12px Segoe UI, sans-serif';
      fCtx.fillStyle='rgba(200,220,255,0.92)';fCtx.textAlign='center';
      fCtx.fillText(other.name,targX,targY-22);

      // Path name
      if(p.name){
        fCtx.font='10px Segoe UI, sans-serif';
        fCtx.fillStyle='rgba(180,200,255,0.4)';
        fCtx.fillText(p.name,(sx+targX)/2,(sy+targY)/2-8);
      }

      // Task progress
      const tasks=(other.taskIds||[]).map(tid=>DB.tasks[tid]).filter(Boolean);
      if(tasks.length){
        const done=tasks.filter(t=>t.status==='done').length;
        fCtx.font='10px Segoe UI, sans-serif';
        fCtx.fillStyle='rgba(180,200,255,0.45)';
        fCtx.fillText(`${done}/${tasks.length} tasks`,targX,targY+24);
      }

      fHitAreas.push({x:targX,y:targY,r:20,nodeId:othId});
    });

    // Current node (standing position)
    const nCol=statusColor(node.status);
    const glGrad=fCtx.createRadialGradient(sx,sy,0,sx,sy,60);
    glGrad.addColorStop(0,hexAlpha(nCol,0.3));glGrad.addColorStop(1,'rgba(0,0,0,0)');
    fCtx.fillStyle=glGrad;fCtx.fillRect(sx-70,sy-70,140,140);
    fCtx.beginPath();fCtx.arc(sx,sy,15,0,Math.PI*2);
    fCtx.fillStyle=hexAlpha(nCol,0.85);fCtx.fill();
    fCtx.beginPath();fCtx.arc(sx,sy,6,0,Math.PI*2);
    fCtx.fillStyle='#fff';fCtx.fill();

    fFrame=requestAnimationFrame(frame);
  }
  frame();

  // Click handler
  cv.onclick=(e)=>{
    const rect=cv.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    fHitAreas.forEach(h=>{
      if(Math.hypot(mx-h.x,my-h.y)<h.r+8){
        frontNode=h.nodeId;selNode=h.nodeId;
        renderSidebar();openPanel();renderPanel();
        renderFrontView();
      }
    });
  };
  cv.onmousemove=(e)=>{
    const rect=cv.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    cv.style.cursor=fHitAreas.some(h=>Math.hypot(mx-h.x,my-h.y)<h.r+8)?'pointer':'default';
  };
}

function hexAlpha(hex,a){
  // convert #rrggbb + alpha -> rgba string
  if(!hex||!hex.startsWith('#'))return`rgba(100,140,255,${a})`;
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;
}

// ── THESIS VIEW ────────────────────────────────
function renderThesisView(){
  const doc=document.getElementById('tdoc');
  const nodes=Object.values(DB.nodes);
  const allTasks=Object.values(DB.tasks);
  const done=allTasks.filter(t=>t.status==='done').length;
  const paths=Object.values(DB.paths);

  if(!nodes.length){
    doc.innerHTML='<div class="empty" style="padding:60px 20px;">No research nodes yet.<br>Add nodes and write paragraphs to build your thesis document.</div>';
    return;
  }

  doc.innerHTML=`
    <h1>PhD Research Thesis</h1>
    <div class="tdoc-meta">${nodes.length} nodes · ${paths.length} paths · ${done}/${allTasks.length} tasks complete · Last saved ${new Date().toLocaleDateString()}</div>
    ${nodes.map(n=>{
      const tasks=(n.taskIds||[]).map(tid=>DB.tasks[tid]).filter(Boolean);
      const ndone=tasks.filter(t=>t.status==='done').length;
      const paras=n.paragraphs||[];
      const col=statusColor(n.status);
      return`<div class="tsec">
        <h2><span style="color:${col};font-size:10px;">●</span> ${esc(n.name)}
          <span style="font-size:11px;font-weight:400;color:var(--dim);margin-left:8px;">${n.status} · ${ndone}/${tasks.length} tasks</span>
        </h2>
        ${n.description?`<p style="color:var(--dim);font-style:italic;">${esc(n.description)}</p>`:''}
        ${paras.length?paras.map(p=>`<p>${esc(p.content)}</p>${p.refs?`<div class="tref">[${esc(p.refs)}]</div>`:''}`).join('')
          :'<p style="color:var(--dim);font-style:italic;font-size:12px;">No paragraphs written yet for this node.</p>'}
      </div>`;
    }).join('')}
    <div style="margin-top:28px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;">
      <button class="btn btn-ghost btn-sm" onclick="exportThesis()">Export as Text</button>
    </div>`;
}

function exportThesis(){
  const nodes=Object.values(DB.nodes);
  let t='PhD RESEARCH THESIS\n'+'═'.repeat(40)+'\n\n';
  nodes.forEach(n=>{
    t+=`## ${n.name} [${n.status}]\n\n`;
    if(n.description)t+=n.description+'\n\n';
    (n.paragraphs||[]).forEach(p=>{t+=p.content+'\n';if(p.refs)t+=`[${p.refs}]\n`;t+='\n';});
    t+='\n';
  });
  const b=new Blob([t],{type:'text/plain'});
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(b),download:`thesis-${today()}.txt`});
  a.click();
}

// ── SETTINGS ───────────────────────────────────
function getZoteroSettings(){
  return{uid:localStorage.getItem('zot_uid')||'', key:localStorage.getItem('zot_key')||''};
}
function saveZoteroSettings(uid,key){
  localStorage.setItem('zot_uid',uid.trim());
  localStorage.setItem('zot_key',key.trim());
}

function showSettings(){
  const {uid,key}=getZoteroSettings();
  showModal(`<h3>⚙ Zotero Settings</h3>
    <p style="font-size:12px;color:var(--dim);margin-bottom:16px;line-height:1.6;">
      Connect your Zotero library to get predictive search when adding Literature tasks.<br><br>
      1. Find your <strong>User ID</strong> at zotero.org → Settings → Feeds/API<br>
      2. Create an <strong>API Key</strong> (read-only is enough) at the same page
    </p>
    <div class="fg"><label>Zotero User ID</label>
      <input id="zot-uid" value="${esc(uid)}" placeholder="e.g. 1234567"></div>
    <div class="fg"><label>Zotero API Key</label>
      <input id="zot-key" type="password" value="${esc(key)}" placeholder="Paste your API key..."></div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-sm" onclick="_saveZotSettings()">Save</button>
    </div>`);
}
function _saveZotSettings(){
  const uid=document.getElementById('zot-uid')?.value||'';
  const key=document.getElementById('zot-key')?.value||'';
  saveZoteroSettings(uid,key);
  closeModal();
}

// ── API ────────────────────────────────────────
async function searchZotero(query){
  const {uid,key}=getZoteroSettings();
  if(!uid||!key)return null; // null = not configured
  const url=`https://api.zotero.org/users/${uid}/items?q=${encodeURIComponent(query)}&limit=10&format=json&itemType=-attachment`;
  const res=await fetch(url,{headers:{'Zotero-API-Key':key}});
  if(!res.ok)throw new Error(`Zotero API error ${res.status}`);
  return await res.json();
}

function _zotLabel(item){
  const d=item.data;
  const authors=(d.creators||[]).filter(c=>c.creatorType==='author');
  const last=authors[0]?.lastName||authors[0]?.name||'Unknown';
  const year=d.date?d.date.slice(0,4):'';
  const title=d.title||'Untitled';
  return year?`${last} (${year}) — ${title}`:`${last} — ${title}`;
}

function _zotMeta(item){
  const d=item.data;
  const authors=(d.creators||[]).filter(c=>c.creatorType==='author');
  const last=authors[0]?.lastName||authors[0]?.name||'Unknown';
  const allAuthors=authors.map(a=>a.lastName||a.name).filter(Boolean).join(', ');
  const year=d.date?d.date.slice(0,4):'';
  const title=d.title||'Untitled';
  const journal=d.publicationTitle||d.journalAbbreviation||d.bookTitle||'';
  const n=authors.length;
  const citation=year
    ?(n>2?`${last} et al. (${year})`:(n===2?`${authors[0]?.lastName||''} & ${authors[1]?.lastName||''} (${year})`:`${last} (${year})`))
    :last;
  return{key:item.key,title,authors:allAuthors,year,journal,citation};
}

// ── AUTOCOMPLETE STATE ─────────────────────────
let _zotTimer=null;
let _zotResults=[];
let _pendingZotItem=null;

function _onTaskTypeChange(){
  _pendingZotItem=null;
  _zotResults=[];
  const dd=document.getElementById('zot-dd');
  const hint=document.getElementById('zot-hint');
  const inp=document.getElementById('tn');
  const type=document.getElementById('tt')?.value;
  if(dd)dd.style.display='none';
  if(hint)hint.style.display=type==='literature'?'block':'none';
  if(inp&&type==='literature'){
    inp.placeholder='Search Zotero library…';
  } else if(inp){
    inp.placeholder='Task name…';
  }
}

function _onTaskNameInput(){
  const type=document.getElementById('tt')?.value;
  if(type!=='literature'){return;}
  _pendingZotItem=null;
  clearTimeout(_zotTimer);
  const q=document.getElementById('tn')?.value.trim();
  const dd=document.getElementById('zot-dd');
  if(!q||q.length<2){if(dd)dd.style.display='none';return;}
  _zotTimer=setTimeout(()=>_doZotSearch(q),380);
}

async function _doZotSearch(query){
  const dd=document.getElementById('zot-dd');
  if(!dd)return;

  const {uid,key}=getZoteroSettings();
  if(!uid||!key){
    dd.innerHTML='<div class="zot-item" style="color:var(--amber);">⚙ Set your Zotero API key in the Zotero button above first.</div>';
    dd.style.display='block';return;
  }

  dd.innerHTML='<div class="zot-item" style="color:var(--dim);">Searching…</div>';
  dd.style.display='block';

  try{
    const items=await searchZotero(query);
    if(!document.getElementById('zot-dd'))return; // panel re-rendered
    if(!items||!items.length){
      dd.innerHTML='<div class="zot-item" style="color:var(--dim);">No results found.</div>';return;
    }
    _zotResults=items;
    dd.innerHTML=items.map((item,i)=>{
      const label=_zotLabel(item);
      const meta=_zotMeta(item);
      const journal=meta.journal?`<div class="zot-meta">${esc(meta.journal)}${meta.year?' · '+meta.year:''}</div>`:'';
      return`<div class="zot-item" onclick="selectZotItem(${i})">
        <div class="zot-title">${esc(label)}</div>
        ${journal}
      </div>`;
    }).join('');
  }catch(e){
    if(document.getElementById('zot-dd'))
      dd.innerHTML=`<div class="zot-item" style="color:var(--red);">Error: ${esc(e.message)}</div>`;
  }
}

function selectZotItem(idx){
  const item=_zotResults[idx];if(!item)return;
  _pendingZotItem=_zotMeta(item);
  const inp=document.getElementById('tn');
  if(inp)inp.value=_pendingZotItem.title;
  const dd=document.getElementById('zot-dd');
  if(dd)dd.style.display='none';
}

// Close dropdown on outside click
document.addEventListener('click',e=>{
  const dd=document.getElementById('zot-dd');
  if(dd&&!dd.contains(e.target)&&e.target.id!=='tn')dd.style.display='none';
});

// ── REFERENCE PICKER ───────────────────────────
function _toggleRefPicker(){
  const picker=document.getElementById('ref-picker');
  if(!picker)return;
  if(picker.style.display==='block'){picker.style.display='none';return;}

  const node=DB.nodes[selNode];
  const litTasks=(node?.taskIds||[])
    .map(tid=>DB.tasks[tid])
    .filter(t=>t&&t.type==='literature');

  if(!litTasks.length){
    picker.innerHTML='<div style="font-size:12px;color:var(--dim);">No literature tasks on this node yet.<br>Add some in the Tasks tab first.</div>';
  } else {
    // Show all lit tasks — Zotero-linked ones first, then manual ones
    const zotLinked=litTasks.filter(t=>t.zoteroData);
    const manual=litTasks.filter(t=>!t.zoteroData);
    let html='';
    if(zotLinked.length){
      html+=`<div style="font-size:10px;color:var(--dim);margin-bottom:5px;letter-spacing:.5px;">FROM ZOTERO</div>`;
      html+=zotLinked.map(t=>{
        const label=t.zoteroData.citation;
        return`<span class="ref-chip" onclick="_appendRef('${label.replace(/'/g,"\\'")}')">
          ${esc(label)} <span class="zot-badge">Z</span>
        </span>`;
      }).join('');
    }
    if(manual.length){
      if(zotLinked.length)html+=`<div style="font-size:10px;color:var(--dim);margin:8px 0 5px;letter-spacing:.5px;">MANUAL TASKS</div>`;
      html+=manual.map(t=>`<span class="ref-chip" onclick="_appendRef('${t.name.replace(/'/g,"\\'")}')">${esc(t.name)}</span>`).join('');
    }
    picker.innerHTML=html;
  }
  picker.style.display='block';
}

function _appendRef(citation){
  const inp=document.getElementById('prefs');if(!inp)return;
  const cur=inp.value.trim();
  inp.value=cur?cur+'; '+citation:citation;
  inp.focus();
}
